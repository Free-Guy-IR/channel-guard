<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>بکاپ</title>
<link rel="stylesheet" href="/static/theme.css" />
<style>
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  @media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
  .form-grid label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .form-grid input, .form-grid select {
    width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--card-border);
    background: #f8f7fb; color: var(--text-primary); font-size: 13.5px; outline: none;
  }
  .form-grid input:focus, .form-grid select:focus { border-color: var(--primary); background: #ffffff; }
  .add-btn {
    padding: 11px 22px; border-radius: var(--radius-sm); border: none;
    background: linear-gradient(135deg, var(--primary), var(--series-purchase)); color: #ffffff; font-size: 13.5px; font-weight: 700;
    cursor: pointer;
  }
  .add-btn:disabled { opacity: 0.6; cursor: default; }
  .form-msg { font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  .form-msg.err { color: var(--critical); }
  .form-msg.ok { color: var(--good); }

  .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 3px 10px; border-radius: 999px; }
  .status-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
  .status-badge.online { background: rgba(31,161,89,0.1); color: var(--good); }
  .status-badge.online .dot { background: var(--good); }
  .status-badge.installing { background: rgba(59,91,253,0.1); color: var(--primary); }
  .status-badge.installing .dot { background: var(--primary); }
  .status-badge.error { background: rgba(220,53,69,0.1); color: var(--critical); }
  .status-badge.error .dot { background: var(--critical); }

  .kv-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--card-border); font-size: 13px; }
  .kv-row:last-child { border-bottom: none; }
  .kv-row .k { color: var(--text-secondary); }
</style>
</head>
<body>
<script>window.ADMIN_BASE = "__ADMIN_BASE__";</script>

<div class="app-shell">
  <aside class="sidebar">
    <div class="side-brand"><span class="mark">🛰️</span><span class="name">پایش کانال</span></div>
    <nav class="side-nav">
      <a class="side-link" id="dash-link" href="#"><span class="ic">📊</span>داشبورد</a>
      <a class="side-link" id="nodes-link" href="#"><span class="ic">🌐</span>نودها</a>
      <a class="side-link" id="surveys-link" href="#"><span class="ic">📋</span>نظرسنجی‌ها</a>
      <a class="side-link" id="sales-link" href="#"><span class="ic">💰</span>آنالیز فروش</a>
      <a class="side-link" id="sales-users-link" href="#"><span class="ic">👥</span>کاربران فروش</a>
      <a class="side-link active" id="backup-link" href="#"><span class="ic">💾</span>بکاپ</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="content-header">
      <h1>بکاپ کامل پنل‌ها</h1>
    </div>

    <div class="page-wrap">
      <div class="card glass">
        <h2>وضعیت
          <span class="hint">این بکاپ شامل هر دو پنل (چنل‌گارد و OpenVPN) با هم می‌شود — از هر پنلی بگیری، نتیجه یکسان است.</span>
        </h2>
        <div id="status-box">
          <div class="kv-row"><span class="k">آخرین بکاپ</span><span id="st-last-run">—</span></div>
          <div class="kv-row"><span class="k">نتیجه</span><span id="st-result">—</span></div>
          <div class="kv-row"><span class="k">حجم فایل</span><span id="st-size">—</span></div>
          <div class="kv-row"><span class="k">مدت زمان</span><span id="st-duration">—</span></div>
        </div>
        <button type="button" class="add-btn" id="run-btn" style="margin-top:14px">📦 بکاپ‌گیری فوری</button>
        <div class="form-msg" id="run-msg"></div>
      </div>

      <div class="card glass">
        <h2>تنظیمات ارسال خودکار</h2>
        <form id="settings-form">
          <div class="form-grid">
            <div>
              <label>چت‌آیدی عددی ادمین (تلگرام)</label>
              <input type="text" id="s-chat-id" placeholder="مثلاً 123456789" required />
            </div>
            <div class="full">
              <label>توکن ربات ارسال‌کننده (خالی بگذار تا تغییر نکند)</label>
              <input type="text" id="s-bot-token" placeholder="۱۲۳۴۵۶۷۸۹:AA..." />
            </div>
            <div>
              <label>هر چند وقت یک‌بار بکاپ گرفته شود</label>
              <input type="number" id="s-interval-value" min="1" value="6" required />
            </div>
            <div>
              <label>واحد زمانی</label>
              <select id="s-interval-unit">
                <option value="minutes">دقیقه</option>
                <option value="hours" selected>ساعت</option>
              </select>
            </div>
          </div>
          <button type="submit" class="add-btn" id="save-settings-btn">ذخیره تنظیمات</button>
          <div class="form-msg" id="settings-msg"></div>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="/static/backup.js"></script>
</body>
</html>
